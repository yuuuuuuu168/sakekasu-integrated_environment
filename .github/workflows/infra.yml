# 共通基盤（infra/）の型・テスト・合成。AWS の認証は要らない
name: infra

on:
  pull_request:
    paths:
      - 'infra/**'
      - '.github/workflows/infra.yml'
      - '.github/workflows/deploy.yml'

# PR に続けて push したら、前の実行は打ち切る。結果を見るのは最新のコミットだけなので。
# main へのマージ後には走らせない。PR の時点で main と混ぜた結果を検査していて、
# deploy 系のワークフローもデプロイの前に同じ npm test を通すため、二重になる。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  infra:
    name: 型 / テスト / synth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    # 合成はアカウント ID をダミーにして通す
    env:
      CDK_DEFAULT_ACCOUNT: '000000000000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm test
      # cdk.json のまま（独自ドメインを有効にした形）
      - run: npx cdk synth -q
      # 独自ドメインの ID を外した形（Cognito のドメインと CloudFront の既定のドメインで出す）も合成しておく
      - run: >-
          npx cdk synth -q
          -c authHostedZoneId=
          -c authCertificateId=
          -c apexCertificateId=
      # GitHub Actions のロールのスタックも合成しておく
      - run: npx cdk synth -q -c github-oidc=true
      - run: npx cdk synth -q -c cdkd-deploy=true
