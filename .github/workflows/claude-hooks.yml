# Claude Code 用のフック（scripts/）と共通テーマ（theme/）のテスト。
#
# AWS の変更操作を止めるガード（deny-aws-writes）は、壊れても何も言わずに
# 素通りさせる側に倒れうる。アプリのコードとは別に、ここで毎回確かめる。
name: claude-hooks

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'theme/**'
      - '.claude/settings.json'
      - '.template-sync.json'
      - '.github/workflows/claude-hooks.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'theme/**'
      - '.claude/settings.json'
      - '.template-sync.json'
      - '.github/workflows/claude-hooks.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: settings.json が JSON として読める
        run: node -e "JSON.parse(require('fs').readFileSync('.claude/settings.json','utf8'))"
      - name: シェルスクリプトの構文
        run: for f in scripts/*.sh; do bash -n "$f"; done
      - name: deny-aws-writes と template-sync のテスト
        run: node --test scripts/deny-aws-writes.test.mjs scripts/template-sync.test.mjs
      - name: .template-sync.json が JSON として読める
        run: node -e "JSON.parse(require('fs').readFileSync('.template-sync.json','utf8'))"
      - name: japanese-guard のテスト
        run: python3 scripts/japanese-guard/test_japanese_guard.py
      - name: 共通テーマのテスト（ダークの値の一致とコントラスト）
        run: node --test theme/sakekasu-theme.test.mjs
