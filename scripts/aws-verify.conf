# クラウドセッションの verify プロファイル（読み取り専用）が参照する IAM Identity Center の値。
# scripts/setup-aws-profile.sh が読んで ~/.aws/config に書き出す。シークレットは含まない。
# 同名の環境変数があれば、そちらが優先される。
#
# SSO_ACCOUNT_ID は verify プロファイル（Web アプリのデプロイ先）のアカウント。既定は
# sakekasu-builder と同じで、テンプレートから作ったあと書き換える必要はない。
# 別のアカウントに載せるアプリだけ変える。
SSO_START_URL=https://d-xxxxxxxxxx.awsapps.com/start
SSO_REGION=ap-northeast-1
SSO_ACCOUNT_ID=232791540685
SSO_ROLE_NAME=AgentVerifyAccess
AWS_VERIFY_REGION=ap-northeast-1

# verify 以外に見たいアカウント。「プロファイル名:アカウントID」をカンマで並べる。
# プロファイル名は verify- で始める。どれも同じ SSO セッションを使うので、ログインは1回で済む。
# 各アカウントに Permission Set（SSO_ROLE_NAME）が割り当ててあることが前提。
# 割り当てが無いアカウントは、そのプロファイルを使った時点で権限エラーになる
#   verify-org: Organization の管理アカウント
#   verify-ops: 運用ツール用アカウント（Security Agent / DevOps Agent）
SSO_EXTRA_PROFILES=verify-org:<管理アカウント ID>,verify-ops:<運用アカウント ID>
